services:

  # ── Redis (token blacklist) ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no  # in-memory only, no disk persistence
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cuesync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-cuesync}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cuesync} -d ${POSTGRES_DB:-cuesync}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # DB port NOT exposed to host — only backend can reach it via internal network

  # ── FastAPI backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-cuesync}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cuesync}}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-cuesync}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cuesync}}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Port NOT exposed to host — Nginx proxies to it via internal network

  # ── React frontend (Nginx) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      # Changed fallback host port from 80 to 3000 to prevent conflicts
      - "${FRONTEND_PORT:-7832}:80"
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  default:
    name: cuesync_net