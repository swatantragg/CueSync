services:

  # ── Redis (token blacklist) ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no  # in-memory only, no disk persistence
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  # ── FastAPI backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-cuesync}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cuesync}}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-cuesync}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cuesync}}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # Only used to create the hidden super admin if that account doesn't exist yet
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      # Client Gmail connections (Google OAuth) — see backend/.env.example
      FRONTEND_URL: ${FRONTEND_URL:-https://cuesync.musicrightsmanagement.in}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://cuesync-b.musicrightsmanagement.in/api/mail/oauth/callback}
      MAIL_TOKEN_KEY: ${MAIL_TOKEN_KEY:-}
      # Weekly email reports through Brevo — see backend/.env.example
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-CueSync Reports}
      BREVO_REPLY_TO: ${BREVO_REPLY_TO:-}
      REPORT_ENABLED: ${REPORT_ENABLED:-false}
      REPORT_DAY: ${REPORT_DAY:-monday}
      REPORT_TIME: ${REPORT_TIME:-09:00}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Asia/Kolkata}
    depends_on:
      redis:
        condition: service_healthy
    # Port NOT exposed to host — Nginx proxies to it via internal network

  # ── React frontend (Nginx) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "https://cuesync-b.musicrightsmanagement.in"
    restart: unless-stopped
    ports:
      # Changed fallback host port from 80 to 3000 to prevent conflicts
      - "${FRONTEND_PORT:-7832}:80"
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  default:
    name: cuesync_net